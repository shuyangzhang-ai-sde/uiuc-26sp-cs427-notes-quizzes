<script type="application/json" id="exam2-questions-json">[{"q":"Which concept below expresses the overall size of a work item but is unitless and denotes only relative values?","opts":["(a) Ideal time","(b) Velocity","(c) Elapsed time","(d) Story point"],"correct":3,"exp":"Story points are relative, unitless sizing tokens (often tied to effort/complexity), unlike elapsed wall-clock time."},{"q":"Lesson 2.7 discussed the biggest risks in software projects. Is the following statement true or false? \"Risk management is an evaluation of the current software product to identify potential faults.\"","opts":["(a) False","(b) True"],"correct":0,"exp":"Risk management focuses on project/process risks (schedule, scope, resources), not evaluating the built product for faults—that leans toward testing/reviews."},{"q":"In Extreme Programming (XP), each iteration is organized as a two-week cycle. What activity takes place at the start of each iteration?","opts":["(a) The team changes all pair programming assignments for the next two weeks.","(b) All tests from the previous iteration are deleted and rewritten.","(c) An iteration planning meeting is held to plan the work for that iteration.","(d) The customer writes all new user stories for the entire project."],"correct":2,"exp":"XP iterations begin with planning the iteration's scope/commitments (iteration planning), not rewriting all tests or wholesale story churn."},{"q":"The following requirement is a __________ requirement. \"Reliability estimations must take no longer than 2.5 seconds to complete and display results.\"","opts":["(a) Non-functional","(b) Functional"],"correct":0,"exp":"Timing/performance constraints describe quality attributes—non-functional requirements—rather than specific behaviors/features."},{"q":"Security requirements are often stated as ___________ requirements.","opts":["(a) Non-functional","(b) Functional"],"correct":0,"exp":"Security properties (confidentiality, integrity, etc.) are typically captured as non-functional / quality requirements."},{"q":"Which of the following is NOT a correct statement on software design?","opts":["(a) It is desirable to have low cohesion","(b) It is desirable to have information hiding","(c) It is desirable to have high modularity","(d) It is desirable to have low coupling"],"correct":0,"exp":"High cohesion is desirable; low cohesion means unrelated responsibilities mixed together."},{"q":"Which of the following is the least desirable type of module cohesion among the following options?","opts":["(a) Communicational cohesion","(b) Coincidental cohesion","(c) Functional cohesion","(d) Procedural cohesion"],"correct":1,"exp":"Coincidental cohesion is the weakest (parts unrelated except they ended up in the same module)."},{"q":"Is the following statement true or false? \"A sequence diagram has no way to represent conditional logic.\"","opts":["(a) False","(b) True"],"correct":0,"exp":"Sequence diagrams can model guards/alt/opt fragments for conditional paths."},{"q":"In the pipe-and-filter architectural style, which of the following is true?","opts":["(a) Filters are independent and process data incrementally as it arrives.","(b) Filters must know about upstream and downstream filters.","(c) Filters share state with each other.","(d) Data flows bidirectionally between filters."],"correct":0,"exp":"Filters are loosely coupled stages along a pipeline; they consume/produce streams and should not require shared mutable state or explicit neighbor knowledge."},{"q":"Which of the following statements best captures the essence of when the Strategy pattern should be applied?","opts":["(a) Define a one-to-many dependency between objects so that when one object changes state, all its dependents are notified and the algorithm changes automatically.","(b) Define a family of algorithms, encapsulate each one, and make them interchangeable so that the algorithm can vary independently from the clients that use it.","(c) Allows an object to alter its behavior when its internal state changes.","(d) Encapsulate a request as an object, thereby letting you parameterize clients with different requests."],"correct":1,"exp":"Strategy encapsulates interchangeable algorithms so clients depend on a stable interface, not concrete algorithms."},{"q":"A system currently uses the Interpreter pattern to evaluate expressions, with each class implementing its own interpret method. The development team wants to centralize the evaluation logic to make it easier to modify and extend operations without changing existing element classes. Which pattern should be used?","opts":["(a) Visitor pattern","(b) Observer pattern","(c) Composite pattern","(d) Strategy pattern"],"correct":0,"exp":"Visitor externalizes operations over an object structure so you can add new operations without editing each element class."},{"q":"__________ test cases should be written without knowledge of code structure. It is advisable that these test cases __________ written by the original programmer.","opts":["(a) White box, are not","(b) Black box, are not","(c) Black box, are","(d) White box, are"],"correct":1,"exp":"Black-box tests derive from specs/interfaces; independence from implementation detail reduces blind spots from the author's assumptions."},{"q":"Which type of testing between the two below is more effective in detecting missing-logic fault?","opts":["(a) Black-box testing","(b) White-box testing"],"correct":0,"exp":"Missing logic vs intended behavior often surfaces through externally observable failures—black-box expectations/spec-based tests catch many such gaps."},{"q":"Consider a program in which all predicates are simple — that is, each predicate consists of only a single condition, with no logical operators such as && or ||. Is the following statement true or false? \"For a program in which all predicates are simple, condition coverage and branch coverage will always have same metric values when using the same test suite.\"","opts":["(a) False","(b) True"],"correct":1,"exp":"With only simple predicates, each branch edge aligns with that atomic condition's outcomes (no compound boolean short-circuit subtleties)."},{"q":"Which one of the following equations is NOT a valid property for the following IntSet class that represents a Set's common behavior (as discussed in our lecture video/slides on parameterized unit tests)?","opts":["(a) Foreach int i, int j, IntSet s: s !=null => member(IntSet().ret, i).ret == false","(b) Foreach int i, int j, IntSet s: s !=null => member(remove(s, i).state, i).ret == false","(c) Foreach int i, int j, IntSet s: s !=null => member(insert(s, i).state, i).ret == true","(d) Foreach int i, int j, IntSet s: s !=null => member(insert(s, j).state, i).ret == member(s, i).ret"],"correct":3,"exp":"(d) fails when i == j but i was not originally present (insert makes membership true while RHS stays false).","code":"class IntSet {\n  public IntSet() { ... }\n  public void insert(int e) { ... }\n  public boolean member(int e) { ... }\n  public void remove(int e) { ... }\n  public boolean equals(IntSet o) { ... }\n}","afterCode":"Note that in the methods presented in the following equations (i.e., insert, member, remove, equals), the first argument represents the receiver object. The state of the receiver object after executing the method m is denoted as m.state, while the return value of the method m is represented as m.ret."},{"q":"In JUnit, why is it important to initialize test data separately for each test method?","opts":["(a) To ensure tests do not depend on shared state from previous executions.","(b) To improve performance by reducing repeated setup operations.","(c) To allow test methods to share objects created during earlier tests.","(d) To guarantee tests execute in a specific order."],"correct":0,"exp":"Per-test setup isolates failures and avoids order-dependent flakiness from mutable shared fixtures."},{"q":"Consider the following program that uses binary search to check whether the input array (assumed to be sorted in non-descending order) contains a specific input value; Find out all the buggy line(s). Select all possible options that apply.","opts":["(a) Line 6: int middle = (low + high - 1) / 2;","(b) Line 7: if (b >= a[middle]) {","(c) Line 8: low = middle + 1;","(d) Line 9: } else if (b \u003c a[middle]) {","(e) Line 10: high = middle - 1;","(f) Line 12: return true"],"correct":[0,1],"exp":"Middle should be (low+high)/2; the compare branch sends equality down the wrong path so hits never return true.","code":"public class BinarySearch {                             // 1\n    public boolean contains(int[] a, int b) {           // 2\n        int low = 0;                                    // 3\n        int high = a.length - 1;                        // 4\n        while (low \u003c= high) {                           // 5\n            int middle = (low + high - 1) / 2;          // 6\n            if (b >= a[middle]) {                       // 7\n                low = middle + 1;                       // 8\n            } else if (b \u003c a[middle]) {                 // 9\n                high = middle - 1;                      // 10\n            } else {                                    // 11\n                return true;                            // 12\n            }                                           // 13\n        }                                               // 14\n        return false;                                   // 15\n    }                                                   // 16\n}                                                       // 17"},{"q":"Consider the following code for deserializing a BinaryTree, e.g., [1,null,null] denotes a tree with only a root node of value 1 with no children. Which of the following tests will cover the true branch of line 19 in method deserializeRec, i.e., if (level.size() == 0) return;. Select all possible options that apply.","opts":["(a) [1,1,1,null,null,null,null]","(b) [1,1,1,null,null,null,null,null,null]","(c) [1,null,null]","(d) [1,null,null,null,null]"],"correct":[1,3],"exp":"You need a traversal path that yields an empty working level while recursion continues—those inputs expose the early return on line 19.","code":"class BinaryTreeDeserializer {                                          // 1\n    public TreeNode deserialize(String data) {                          // 2\n        //check if data is valid                                        // 3\n        if (data.length() \u003c 3) return null;                             // 4\n        //remove \"[\" and \"]\"                                            // 5\n        data = data.substring(1, data.length() - 1);                    // 6\n        //separate to parts                                             // 7\n        String[] parts = data.split(\",\");                               // 8\n        List\u003cTreeNode> level = new ArrayList\u003cTreeNode>();               // 9\n        TreeNode node = getNode(parts[0]);                              // 10\n        if (node != null) {                                             // 11\n            level.add(node);                                            // 12\n            deserializeRec(parts, 1, level);                            // 13\n        }                                                               // 14\n        return node;                                                    // 15\n    }                                                                   // 16\n    private void deserializeRec(String[] parts, int i, List\u003cTreeNode> level) { // 17\n        if (i >= parts.length) return;                                  // 18\n        if (level.size() == 0) return;                                  // 19\n        List\u003cTreeNode> nextLevel = new ArrayList\u003cTreeNode>();           // 20\n        for (TreeNode n : level) {                                      // 21\n            n.left = getNode(parts[i++]);                               // 22\n            n.right = getNode(parts[i++]);                              // 23\n            if (n.left != null) nextLevel.add(n.left);                  // 24\n            if (n.right != null) nextLevel.add(n.right);                // 25\n        }                                                               // 26\n        deserializeRec(parts, i, nextLevel);                            // 27\n    }                                                                   // 28\n    private TreeNode getNode(String s) {                                // 29\n        if (s.charAt(0) == 'n') return null;                            // 30\n        return new TreeNode(Integer.parseInt(s));                       // 31\n    }                                                                   // 32\n    ...                                                                 // 33\n}                                                                       // 34"},{"q":"Consider the following program for finding the median of the three input parameters; Find out the buggy line(s). Select all possible options that apply.","opts":["(a) Line 6: m=x;","(b) Line 8: m=y;","(c) Line 11: m=y;","(d) Line 13: m=x;"],"correct":[0,1],"exp":"Assignments on lines 6 and 8 mis-assign medians in parts of the y\u003cz branch—classic median-of-three boundary bug.","code":"public class TestMe {                        // 1\n    public int mid(int x, int y, int z) {   // 2\n        int m = z;                           // 3\n        if (y \u003c z) {                         // 4\n            if (x \u003c y)                       // 5\n                m = x;                       // 6\n            else if (x \u003c z)                  // 7\n                m = y;                       // 8\n        } else {                             // 9\n            if (x > y)                       // 10\n                m = y;                       // 11\n            else if (x > z)                  // 12\n                m = x;                       // 13\n        }                                    // 14\n        return m;                            // 15\n    }                                        // 16\n}                                            // 17"},{"q":"Which one of the following is least likely to be a key element in tracking/reproducing a problem?","opts":["(a) Change multiple variables that may alter symptoms at the same time to speed up the debugging process","(b) Check the reproducibility of the failure as part of writing a problem report","(c) Document a crisp sequence of actions that will reproduce the failure","(d) Look for related failures in the software under test"],"correct":0,"exp":"One-change-at-a-time discipline preserves causal clarity; simultaneous changes confound symptoms."},{"q":"In delta debugging for failing-input simplification, what happens when both halves of a failing input produce passing results?","opts":["(a) The original input is returned as the minimum failing input.","(b) The granularity of changes is refined to produce more, smaller alternatives.","(c) The process switches to binary search.","(d) The process terminates with no result."],"correct":1,"exp":"When neither half fails, the algorithm narrows grain (finer partitions/combinations) instead of stopping."},{"q":"Which of the following is NOT a class invariant for the class below?","opts":["(a) Math.minInt() \u003c upper","(b) lower \u003c upper","(c) upper \u003c Math.maxInt()","(d) lower \u003c Math.maxInt()"],"correct":2,"exp":"Upper may legitimately equal Math.maxInt() after widening range—strict `\u003c max` is not forced by the mutators shown.","code":"class ValueRange {\n    private int lower = Math.minInt();\n    private int upper = Math.maxInt();\n\n    void setLower(int i) { if (i \u003c upper) lower = i; }\n    void setUpper(int i) { if (i > lower) upper = i; }\n}"},{"q":"Consider the following code snippet. Please select all the code smells that would generate a warning for this code. Select all possible options that apply.","opts":["(a) JavadocMethod: Checks the Javadoc of a method or constructor.","(b) MultipleVariableDeclarationsCheck: Checks that each variable declaration is in its own statement and on its own line.","(c) ReturnCountCheck: One method should have only one return statement.","(d) AvoidStarImportCheck: Checks that there are no import statements that use the * notation.","(e) MultipleStringLiteralsCheck: Checks for multiple occurrences of the same string literal within a single file."],"correct":[0,2,3],"exp":"Missing Javadoc on public API methods, multiple returns in checkIn, and star import Entities.* trigger typical Checkstyle warnings.","code":"import Components.Restaurant;\nimport Components.SeatingSystem;\nimport Entities.*;\nimport Terminals.KitchenTerminal;\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class ServiceDeskTerminal extends Terminal {\n\n    private List\u003cSingleTable> tables;\n\n    public ServiceDeskTerminal() {\n        super();\n        tables = new ArrayList\u003cSingleTable>();\n    }\n\n    public CustomerTerminal checkIn(int numberOfPeople) {\n        Restaurant re = Restaurant.getInstance();\n        SeatingSystem ss = re.getSeatingSystem();\n        SingleTable table = ss.getAvailableTable(numberOfPeople);\n        if (table != null) {\n            if (ss.occupy(table)) {\n                tables.add(table);\n                printToScreen(\"New table \" + table.getIndex() + \" checked in, number of people: \" + numberOfPeople);\n                return new CustomerTerminal(table);\n            } else {\n                printToScreen(\"Table \" + table.getIndex() + \" occupied. Check in failed.\", TerminalPrintType.ERROR);\n                return null;\n            }\n        } else {\n            printToScreen(\"Not enough seat\", TerminalPrintType.Error);\n            return null;\n        }\n    }\n}"},{"q":"The code smell 'feature envy' refers to code portions that seem to belong in another class. Which refactoring is most appropriate to address it?","opts":["(a) Introduce Parameter Object","(b) Move Method","(c) Extract Method","(d) Extract Variable"],"correct":1,"exp":"Move Method relocates behavior closer to the data it covets, reducing cross-class envy."},{"q":"The Depth of Inheritance Tree (DIT) metric measures the number of ancestor classes from a class to the root of the hierarchy. Which of the following is a stated implication of a higher DIT value related to system behavior?","opts":["(a) The class reuses fewer methods from its ancestors.","(b) The class requires fewer methods to be implemented.","(c) The class has fewer subclasses in the hierarchy.","(d) The class is harder to predict in its behavior due to inherited methods."],"correct":3,"exp":"Deep hierarchies inherit more behavior from ancestors, increasing polymorphic unpredictability from distant parents."}]</script>
<script src="js/quiz-pane.js"></script>
<script>
var EXAM2_RAW = JSON.parse(document.getElementById('exam2-questions-json').textContent);

function normalizeExam2Questions(raw) {
  return raw.map(function (rq, i) {
    return {
      num: i + 1,
      text: rq.q,
      options: rq.opts,
      correct: rq.correct,
      exp: rq.exp,
      code: rq.code || '',
      afterCode: rq.afterCode || ''
    };
  });
}

var examQuestionsNormalized = normalizeExam2Questions(EXAM2_RAW);
var exam2QuizPane = QuizPane.mount({
  questions: examQuestionsNormalized,
  containerId: 'questions-container',
  scoreId: 'score-display',
  expandExplanationToOptions: true,
  noGlobalReset: true
});

window.resetQuiz = function () {
  var cb = document.getElementById('week15-reveal-answers');
  if (cb) cb.checked = false;
  exam2QuizPane.resetQuiz();
};

function week15SetRevealMode(enabled) {
  if (enabled) {
    exam2QuizPane.resetQuiz();
    examQuestionsNormalized.forEach(function (q, i) {
      exam2QuizPane.revealAnswerKey(i);
    });
  } else {
    exam2QuizPane.resetQuiz();
  }
}
</script>
